<div class="col-md-10 p-4">     

 <head>
<title>Lab Test Booking</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h2>Book Lab Test</h2>

<form id="labForm">

<input type="text" id="patientName" placeholder="Patient Name" required>

<select id="testName">
<option>Blood Test</option>
<option>X-Ray</option>
<option>MRI</option>
<option>CT Scan</option>
</select>

<input type="date" id="date" required>

<button type="submit">Book Test</button>

</form>

<h3>Recent Booking</h3>

<div id="labList"></div>

<div class="col-md-4">
<div class="card p-3">
<h5>Rahul Sharma</h5>
<p>Age: 45</p>
<p>Disease: Diabetes</p>
<p>Recovery</p>
<div class="progress">
<div class="progress-bar bg-success" style="width:70%">70%</div>
</div>
</div>
</div>

<div class="col-md-4">
<div class="card p-3">
<h5>Priya Verma</h5>
<p>Age: 32</p>
<p>Disease: Fever</p>
<p>Recovery</p>
<div class="progress">
<div class="progress-bar bg-success" style="width:60%">60%</div>
</div>
</div>
</div>

</div>
</div>
</div>

<script>

document.getElementById("labForm").addEventListener("submit", function(e){

e.preventDefault();

let name = document.getElementById("patientName").value
let test = document.getElementById("testName").value
let date = document.getElementById("date").value

let bookings = JSON.parse(localStorage.getItem("bookings")) || []

bookings.push({name,test,date})

localStorage.setItem("bookings",JSON.stringify(bookings))

alert("Lab Test Booked Successfully")

})

</script>

</body>
